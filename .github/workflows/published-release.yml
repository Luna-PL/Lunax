name: Published prerelease verification

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Lunax release tag to verify
        required: true
        default: v0.2.0
        type: string

permissions:
  contents: read

concurrency:
  group: published-lunax-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  ubuntu-consumer:
    name: Ubuntu 24.04 x86_64 consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out verification source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Resolve release asset names
        id: assets
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          archive="lunax-${version}-ubuntu-24.04-x86_64.tar.gz"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "package=${archive%.tar.gz}" >> "$GITHUB_OUTPUT"
          echo "checksum=${archive}.sha256" >> "$GITHUB_OUTPUT"
          if test "$RELEASE_TAG" = v0.1.0; then
            echo "has-deb=false" >> "$GITHUB_OUTPUT"
            echo "has-source=false" >> "$GITHUB_OUTPUT"
            echo "expected-count=2" >> "$GITHUB_OUTPUT"
          else
            deb="lunax_${version}_amd64.deb"
            echo "has-deb=true" >> "$GITHUB_OUTPUT"
            echo "deb=$deb" >> "$GITHUB_OUTPUT"
            echo "deb-checksum=${deb}.sha256" >> "$GITHUB_OUTPUT"
            if [[ "$RELEASE_TAG" == v0.1.* ]]; then
              echo "has-source=false" >> "$GITHUB_OUTPUT"
              echo "expected-count=4" >> "$GITHUB_OUTPUT"
            else
              echo "has-source=true" >> "$GITHUB_OUTPUT"
              echo "source=LUNA-SOURCE-COMMIT" >> "$GITHUB_OUTPUT"
              echo "source-checksum=LUNA-SOURCE-COMMIT.sha256" >> "$GITHUB_OUTPUT"
              echo "expected-count=6" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Download the public GitHub Release
        shell: bash
        env:
          ARCHIVE_NAME: ${{ steps.assets.outputs.archive }}
          CHECKSUM_NAME: ${{ steps.assets.outputs.checksum }}
        run: |
          mkdir -p published
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir published \
            --pattern "$ARCHIVE_NAME" \
            --pattern "$CHECKSUM_NAME"

      - name: Download Debian assets
        if: steps.assets.outputs.has-deb == 'true'
        shell: bash
        env:
          DEB_NAME: ${{ steps.assets.outputs.deb }}
          DEB_CHECKSUM_NAME: ${{ steps.assets.outputs.deb-checksum }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir published \
            --pattern "$DEB_NAME" \
            --pattern "$DEB_CHECKSUM_NAME"

      - name: Download Luna source-identity assets
        if: steps.assets.outputs.has-source == 'true'
        shell: bash
        env:
          SOURCE_NAME: ${{ steps.assets.outputs.source }}
          SOURCE_CHECKSUM_NAME: ${{ steps.assets.outputs.source-checksum }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir published \
            --pattern "$SOURCE_NAME" \
            --pattern "$SOURCE_CHECKSUM_NAME"

      - name: Verify release asset set and SHA-256
        shell: bash
        env:
          ARCHIVE_NAME: ${{ steps.assets.outputs.archive }}
          CHECKSUM_NAME: ${{ steps.assets.outputs.checksum }}
          DEB_NAME: ${{ steps.assets.outputs.deb }}
          DEB_CHECKSUM_NAME: ${{ steps.assets.outputs.deb-checksum }}
          HAS_DEB: ${{ steps.assets.outputs.has-deb }}
          SOURCE_NAME: ${{ steps.assets.outputs.source }}
          SOURCE_CHECKSUM_NAME: ${{ steps.assets.outputs.source-checksum }}
          HAS_SOURCE: ${{ steps.assets.outputs.has-source }}
          EXPECTED_COUNT: ${{ steps.assets.outputs.expected-count }}
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets > release-assets.json
          jq -e \
            --arg archive "$ARCHIVE_NAME" \
            --arg checksum "$CHECKSUM_NAME" \
            --arg deb "$DEB_NAME" \
            --arg deb_checksum "$DEB_CHECKSUM_NAME" \
            --arg has_deb "$HAS_DEB" \
            --arg source "$SOURCE_NAME" \
            --arg source_checksum "$SOURCE_CHECKSUM_NAME" \
            --arg has_source "$HAS_SOURCE" \
            --argjson expected_count "$EXPECTED_COUNT" \
            '.assets | length == $expected_count and
              ([.[].name] | sort) ==
                ((if $has_deb == "true" then
                    [$archive, $checksum, $deb, $deb_checksum]
                  else [$archive, $checksum] end) +
                 (if $has_source == "true" then
                    [$source, $source_checksum]
                  else [] end) | sort) and
              all(.[].digest; startswith("sha256:"))' \
            release-assets.json
          checksum_digest="$(jq -r \
            --arg name "$CHECKSUM_NAME" \
            '.assets[] | select(.name == $name) | .digest | sub("^sha256:"; "")' \
            release-assets.json)"
          echo "$checksum_digest  published/$CHECKSUM_NAME" | sha256sum -c -
          test "$(wc -l < "published/$CHECKSUM_NAME")" -eq 1
          (cd published && sha256sum -c "$CHECKSUM_NAME")
          if test "$HAS_DEB" = true; then
            deb_checksum_digest="$(jq -r \
              --arg name "$DEB_CHECKSUM_NAME" \
              '.assets[] | select(.name == $name) | .digest |
                sub("^sha256:"; "")' release-assets.json)"
            echo "$deb_checksum_digest  published/$DEB_CHECKSUM_NAME" |
              sha256sum -c -
            test "$(wc -l < "published/$DEB_CHECKSUM_NAME")" -eq 1
            (cd published && sha256sum -c "$DEB_CHECKSUM_NAME")
          fi
          if test "$HAS_SOURCE" = true; then
            source_checksum_digest="$(jq -r \
              --arg name "$SOURCE_CHECKSUM_NAME" \
              '.assets[] | select(.name == $name) | .digest |
                sub("^sha256:"; "")' release-assets.json)"
            echo "$source_checksum_digest  published/$SOURCE_CHECKSUM_NAME" |
              sha256sum -c -
            test "$(wc -l < "published/$SOURCE_CHECKSUM_NAME")" -eq 1
            (cd published && sha256sum -c "$SOURCE_CHECKSUM_NAME")
            expected_luna_commit="$(node -p \
              "require('./compatibility/luna.json').luna.source_commit")"
            test "$(cat "published/$SOURCE_NAME")" = "$expected_luna_commit"
          fi

      - name: Verify GitHub artifact attestations
        shell: bash
        env:
          ARCHIVE_NAME: ${{ steps.assets.outputs.archive }}
          CHECKSUM_NAME: ${{ steps.assets.outputs.checksum }}
          DEB_NAME: ${{ steps.assets.outputs.deb }}
          DEB_CHECKSUM_NAME: ${{ steps.assets.outputs.deb-checksum }}
          HAS_DEB: ${{ steps.assets.outputs.has-deb }}
          SOURCE_NAME: ${{ steps.assets.outputs.source }}
          SOURCE_CHECKSUM_NAME: ${{ steps.assets.outputs.source-checksum }}
          HAS_SOURCE: ${{ steps.assets.outputs.has-source }}
        run: |
          assets=("$ARCHIVE_NAME" "$CHECKSUM_NAME")
          if test "$HAS_DEB" = true; then
            assets+=("$DEB_NAME" "$DEB_CHECKSUM_NAME")
          fi
          if test "$HAS_SOURCE" = true; then
            assets+=("$SOURCE_NAME" "$SOURCE_CHECKSUM_NAME")
          fi
          for asset in "${assets[@]}"; do
            gh attestation verify "published/$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --deny-self-hosted-runners
          done

      - name: Extract and run the published package
        shell: bash
        env:
          ARCHIVE_NAME: ${{ steps.assets.outputs.archive }}
          PACKAGE_NAME: ${{ steps.assets.outputs.package }}
        run: |
          mkdir -p extracted
          (cd extracted && cmake -E tar xzf "../published/$ARCHIVE_NAME")
          test "$(extracted/$PACKAGE_NAME/bin/lunax version)" = \
            "lunax ${RELEASE_TAG#v}"
          extracted/$PACKAGE_NAME/bin/lunax help
          extracted/$PACKAGE_NAME/bin/lunax backend
          jq -e \
            --arg version "${RELEASE_TAG#v}" \
            '.lunax_version == $version and
              .release_tier == "mvp-prerelease" and
              any(.published_platforms[];
                .target == "ubuntu-24.04-x86_64")' \
            "extracted/$PACKAGE_NAME/share/lunax/compatibility/luna.json"

      - name: Inspect and run the published Debian package
        if: steps.assets.outputs.has-deb == 'true'
        shell: bash
        env:
          DEB_NAME: ${{ steps.assets.outputs.deb }}
        run: |
          dependencies="$(dpkg-deb --field "published/$DEB_NAME" Depends)"
          grep -Eq '(^|, )libcurl4t64([ ,]|$)' <<< "$dependencies"
          grep -Eq '(^|, )tar([ ,]|$)' <<< "$dependencies"
          mkdir -p deb-extracted
          dpkg-deb --extract "published/$DEB_NAME" deb-extracted
          test "$(deb-extracted/usr/bin/lunax version)" = \
            "lunax ${RELEASE_TAG#v}"
